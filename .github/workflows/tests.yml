name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py netlogin tests

  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py netlogin tests

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_client.py -v
      - run: python -m unittest discover -s tests -p test_windows_service.py -v
      - run: python -m unittest discover -s tests -p test_ui.py -v
      - run: python -m compileall -q main.py netlogin tests
      - run: python -m pip install "pyinstaller>=6,<7"
      - run: python -m PyInstaller --onefile --exclude-module setuptools --exclude-module pkg_resources --icon assets/buaa-netlogin.ico --name BUAA-NetLogin main.py
      - name: Smoke-test bundled executable
        shell: pwsh
        run: |
          $output = & .\dist\BUAA-NetLogin.exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            $detail = $output -replace "`r?`n", " | "
            Write-Host "::error::Bundled executable failed: $detail"
            exit 1
          }
          Write-Output $output
      - uses: actions/upload-artifact@v7
        with:
          name: BUAA-NetLogin-Windows-x64
          path: dist/BUAA-NetLogin.exe
          if-no-files-found: error
