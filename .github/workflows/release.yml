name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --onefile --exclude-module setuptools --exclude-module pkg_resources --name BUAA-NetLogin main.py
      - run: ./dist/BUAA-NetLogin --help
      - name: Prepare Linux assets
        run: |
          arch="$(uname -m)"
          mkdir release-assets
          install -m 0755 dist/BUAA-NetLogin "release-assets/BUAA-NetLogin-linux-${arch}"
          tar -C release-assets -czf "release-assets/BUAA-NetLogin-linux-${arch}.tar.gz" "BUAA-NetLogin-linux-${arch}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.os }}
          path: release-assets/
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -p test_client.py -v
      - run: python -m unittest discover -s tests -p test_windows_service.py -v
      - run: python -m unittest discover -s tests -p test_ui.py -v
      - run: python -m PyInstaller --clean --onefile --exclude-module setuptools --exclude-module pkg_resources --name BUAA-NetLogin main.py
      - name: Smoke-test standalone executable
        shell: pwsh
        run: |
          & .\dist\BUAA-NetLogin.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Windows asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          Copy-Item .\dist\BUAA-NetLogin.exe .\release-assets\BUAA-NetLogin-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --onefile --exclude-module setuptools --exclude-module pkg_resources --name BUAA-NetLogin main.py
      - run: ./dist/BUAA-NetLogin --help
      - name: Prepare macOS assets
        run: |
          arch="$(uname -m)"
          mkdir release-assets
          install -m 0755 dist/BUAA-NetLogin "release-assets/BUAA-NetLogin-macos-${arch}"
          tar -C release-assets -czf "release-assets/BUAA-NetLogin-macos-${arch}.tar.gz" "BUAA-NetLogin-macos-${arch}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum BUAA-NetLogin-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "BUAA NetLogin ${GITHUB_REF_NAME}"
